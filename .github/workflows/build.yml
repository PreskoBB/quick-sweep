name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here can write to the repository except the release job at the bottom, which only uploads files.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build QuickSweep.slnx -c Release

      # The hosted runner's account is an administrator. Tests marked Needs=NonAdmin check properties of an ordinary user account,
      # so this step skips them; the standard-user job below runs exactly those.
      - name: Unit tests
        run: dotnet test tests/QuickSweep.Tests -c Release --no-build --filter "Needs!=NonAdmin" --logger "console;verbosity=normal"

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = '0.0.0-ci' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish and pack
        shell: pwsh
        run: |
          ./build.ps1 -Version '${{ steps.ver.outputs.version }}'
          ./tools/package.ps1 -Version '${{ steps.ver.outputs.version }}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuickSweep-${{ steps.ver.outputs.version }}
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error

  # The tests marked Needs=NonAdmin, run as a freshly created standard user (a local account in the Users group only). Best effort:
  # if the runner will not create or log on that account, the job says so in a warning and does not fail the workflow.
  standard-user-tests:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build tests/QuickSweep.Tests -c Release

      - name: Run the non-admin tests as a new standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'qsci'
          $results = 'C:\qsci-results'
          $pw = 'Aa1!' + [Guid]::NewGuid().ToString('N')
          $p = $null
          try {
              New-Item -ItemType Directory -Force $results | Out-Null
              net user $user $pw /add /expires:never | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "net user failed ($LASTEXITCODE)" }
              icacls $env:GITHUB_WORKSPACE /grant "${user}:(OI)(CI)RX" /T /C /Q | Out-Null     # read the sources and the build output
              icacls $results /grant "${user}:(OI)(CI)M" | Out-Null                              # write its results
              $cred = [pscredential]::new(".\$user", (ConvertTo-SecureString $pw -AsPlainText -Force))
              $dotnet = (Get-Command dotnet).Source
              $p = Start-Process -FilePath $dotnet -WorkingDirectory $env:GITHUB_WORKSPACE -Credential $cred -LoadUserProfile -Wait -PassThru `
                  -RedirectStandardOutput "$results\out.txt" -RedirectStandardError "$results\err.txt" `
                  -ArgumentList @('test', 'tests/QuickSweep.Tests', '-c', 'Release', '--no-build', '--filter', 'Needs=NonAdmin', '--logger', 'console;verbosity=normal', '--results-directory', $results)
          } catch {
              Write-Host "::warning::The standard-user tests could not be run on this runner: $_"
              exit 0
          } finally {
              net user $user /delete 2>$null | Out-Null
          }
          Get-Content "$results\out.txt", "$results\err.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "::error::The non-admin tests failed as a standard user (exit code $($p.ExitCode))"; exit 1 }

  # Only runs for a v* tag, and only uploads what the build job produced: no checkout, no build, no scripts from the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: QuickSweep-${{ needs.build.outputs.version }}
          path: release

      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" "release/QuickSweep-$VERSION.zip" "release/QuickSweep-$VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "Quick Sweep $TAG" --generate-notes --verify-tag
