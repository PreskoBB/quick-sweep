name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to attach the zip to a release on a v* tag
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build QuickSweep.slnx -c Release

      # The unit tests need no hardware, no admin rights and no installed copy. Tests marked Needs=NonAdmin check
      # properties of a normal user account; a hosted runner runs as an administrator, so they are skipped here.
      - name: Unit tests
        run: dotnet test tests/QuickSweep.Tests -c Release --no-build --filter "Needs!=NonAdmin" --logger "console;verbosity=normal"

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = '0.0.0-ci' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish and pack
        shell: pwsh
        run: |
          ./build.ps1 -Version '${{ steps.ver.outputs.version }}'
          ./tools/package.ps1 -Version '${{ steps.ver.outputs.version }}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QuickSweep-${{ steps.ver.outputs.version }}
          path: release/*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" release/QuickSweep-${{ steps.ver.outputs.version }}.zip release/QuickSweep-${{ steps.ver.outputs.version }}.zip.sha256 --title "Quick Sweep $env:GITHUB_REF_NAME" --generate-notes --verify-tag
